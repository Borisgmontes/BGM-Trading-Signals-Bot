services:
  - type: web
    name: bgm-btc-radar-staging
    runtime: python
    repo: https://github.com/Borisgmontes/BGM-Trading-Signals-Bot
    branch: feature/btc-radar
    buildCommand: pip install -r requirements.txt
    startCommand: python web_worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bgm-trading-signals-db
          property: connectionString

databases:
  - name: bgm-trading-signals-db
