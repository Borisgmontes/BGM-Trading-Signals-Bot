name: Tests
on:
  pull_request:
  push:
    branches: [main, feature/multiuser-substrategies]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python -m py_compile web_worker.py user_store.py strategy_engine.py
